<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img"
     aria-labelledby="t-soja d-soja" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t-soja">Cosecha récord y lo que ya salió del país</title>
  <desc id="d-soja">Barra de la cosecha récord de soja: 11,5 millones de toneladas en total, de las cuales 7,9 millones ya se habían embarcado hasta septiembre de 2026.</desc>

  <!--
    Ilustración propia. Se dibuja en vez de usar una foto de agencia: las
    imágenes de prensa requieren licencia, y el gráfico cuenta lo mismo con
    datos ya verificados en la nota.
    Paleta del diario: tinta #1A1A18, papel #F7F4EE, ocre #9A5B1E.
    Cada cifra de acá sale de los hechos confirmados del JSON de la historia.
  -->

  <rect width="520" height="250" fill="#EDE8DC"/>
  <text x="26" y="34" font-family="Arial Narrow, Arial, sans-serif" font-size="13"
        letter-spacing="2.6" fill="#9A5B1E">LA CAMPAÑA EN TONELADAS</text>
  <line x1="26" y1="44" x2="494" y2="44" stroke="#1A1A18" stroke-width="1.5"/>
  <!-- Una sola barra: lo cosechado, con lo ya embarcado marcado adentro.
       Dos barras separadas sugerirían que son cosas distintas y no lo son. -->
  <rect x="60" y="90" width="400" height="44" fill="#1A1A18" opacity=".10"/>
  <rect x="60" y="90" width="275" height="44" fill="#9A5B1E"/>
  <line x1="335" y1="84" x2="335" y2="140" stroke="#1A1A18" stroke-width="1.5"/>

  <text x="68" y="120" font-family="Georgia, serif" font-size="26" fill="#F7F4EE">7,9</text>
  <text x="122" y="119" font-family="Arial, Helvetica, sans-serif" font-size="10.5"
        fill="#F7F4EE" opacity=".9">millones de toneladas embarcadas</text>

  <text x="460" y="76" text-anchor="end" font-family="Georgia, serif"
        font-size="26" fill="#1A1A18">11,5</text>
  <text x="460" y="76" font-family="Arial, Helvetica, sans-serif" font-size="0"> </text>
  <text x="398" y="76" text-anchor="end" font-family="Arial Narrow, Arial, sans-serif"
        font-size="11" letter-spacing="1.3" fill="#6A6357">COSECHA RÉCORD</text>

  <text x="345" y="157" font-family="Arial, Helvetica, sans-serif"
        font-size="10" fill="#6A6357">hasta septiembre de 2026</text>

  <line x1="60" y1="178" x2="460" y2="178" stroke="#1A1A18" stroke-width="1" opacity=".3"/>
  <text x="60" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A18">
    La campaña 2026/27 arranca con mejores precios y costos altos
  </text>
  <text x="26" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6A6357">
    Capeco proyecta otro récord de exportación para 2026
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
