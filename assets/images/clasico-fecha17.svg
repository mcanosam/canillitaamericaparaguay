<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img"
     aria-labelledby="t-cla d-cla" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t-cla">Olimpia 2 – Cerro Porteño 0</title>
  <desc id="d-cla">Marcador del clásico de la fecha 17 del Torneo Clausura 2026: Olimpia 2, Cerro Porteño 0. Olimpia se reafirmó como puntero.</desc>

  <!--
    Ilustración propia. Se dibuja en vez de usar una foto de agencia: las
    imágenes de prensa requieren licencia, y el gráfico cuenta lo mismo con
    datos ya verificados en la nota.
    Paleta del diario: tinta #1A1A18, papel #F7F4EE, ocre #9A5B1E.
    Cada cifra de acá sale de los hechos confirmados del JSON de la historia.
  -->

  <rect width="520" height="250" fill="#EDE8DC"/>
  <text x="26" y="34" font-family="Arial Narrow, Arial, sans-serif" font-size="13"
        letter-spacing="2.6" fill="#9A5B1E">EL CLÁSICO</text>
  <line x1="26" y1="44" x2="494" y2="44" stroke="#1A1A18" stroke-width="1.5"/>
  <!-- La fecha va a la izquierda y arriba: contra el borde derecho chocaba
       con el cero. -->
  <text x="26" y="64" font-family="Arial, Helvetica, sans-serif"
        font-size="10.5" fill="#6A6357">Fecha 17 · 31 de octubre de 2026</text>

  <text x="150" y="146" text-anchor="middle" font-family="Georgia, serif"
        font-size="76" fill="#9A5B1E">2</text>
  <text x="260" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" fill="#6A6357">–</text>
  <text x="370" y="146" text-anchor="middle" font-family="Georgia, serif"
        font-size="76" fill="#1A1A18" opacity=".35">0</text>

  <text x="150" y="174" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="14" letter-spacing="2" fill="#1A1A18">OLIMPIA</text>
  <text x="370" y="174" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="14" letter-spacing="2" fill="#6A6357">CERRO PORTEÑO</text>

  <line x1="116" y1="186" x2="184" y2="186" stroke="#9A5B1E" stroke-width="2"/>
  <text x="150" y="206" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="12" fill="#9A5B1E">Puntero del Clausura</text>

  <text x="26" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6A6357">
    Torneo Clausura 2026
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
