<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img"
     aria-labelledby="t-rio d-rio" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t-rio">Cuando baja el río, cada tonelada cuesta más</title>
  <desc id="d-rio">Corte del río Paraguay: el nivel habitual marcado con línea de puntos y, más abajo, la superficie del agua con bajante. Una barcaza flota sobre ella con menos carga. A la derecha, la cadena: baja el río, se carga menos, cuesta más.</desc>

  <!--
    Ilustración propia. Se dibuja en vez de usar una foto de agencia: las
    imágenes de prensa requieren licencia, y el gráfico cuenta lo mismo con
    datos ya verificados en la nota.
    Paleta del diario: tinta #1A1A18, papel #F7F4EE, ocre #9A5B1E.
    Cada cifra de acá sale de los hechos confirmados del JSON de la historia.
  -->

  <rect width="520" height="250" fill="#EDE8DC"/>
  <text x="26" y="34" font-family="Arial Narrow, Arial, sans-serif" font-size="13"
        letter-spacing="2.6" fill="#9A5B1E">EL RÍO MANDA</text>
  <line x1="26" y1="44" x2="494" y2="44" stroke="#1A1A18" stroke-width="1.5"/>
  <!-- Corte del río: el calado manda. Sin cifras porque la nota no las trae;
       lo que informa Cafym es la consecuencia, no una medida. El agua va
       DEBAJO de su superficie y la barcaza flota sobre esa línea: dibujarlo al
       revés es lo primero que se nota. -->

  <!-- lecho -->
  <rect x="60" y="188" width="310" height="10" fill="#1A1A18" opacity=".28"/>

  <!-- cuerpo de agua, con la superficie en el nivel de bajante -->
  <rect x="60" y="150" width="310" height="38" fill="#9A5B1E" opacity=".16"/>
  <line x1="60" y1="150" x2="370" y2="150" stroke="#9A5B1E" stroke-width="2"/>

  <!-- nivel habitual, más arriba -->
  <line x1="60" y1="124" x2="370" y2="124" stroke="#1A1A18" stroke-width="1"
        stroke-dasharray="5 4" opacity=".45"/>
  <text x="64" y="118" font-family="Arial, Helvetica, sans-serif" font-size="9.5"
        fill="#6A6357">nivel habitual</text>
  <text x="64" y="170" font-family="Arial, Helvetica, sans-serif" font-size="9.5"
        fill="#9A5B1E">nivel con bajante</text>

  <!-- la caída, acotada -->
  <line x1="342" y1="124" x2="342" y2="150" stroke="#9A5B1E" stroke-width="1"/>
  <path d="M339 145 l3 5 l3 -5" fill="none" stroke="#9A5B1E" stroke-width="1"/>

  <!-- la barcaza: el casco corta la superficie, no flota en el aire -->
  <path d="M155 138 h130 l-13 26 h-104 z" fill="#1A1A18" opacity=".85"/>
  <rect x="178" y="118" width="84" height="20" fill="#1A1A18" opacity=".5"/>
  <text x="220" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="9" fill="#F7F4EE">menos carga</text>

  <!-- la cadena -->
  <line x1="395" y1="70" x2="395" y2="200" stroke="#1A1A18" stroke-width="1" opacity=".22"/>
  <text x="414" y="92" font-family="Arial Narrow, Arial, sans-serif" font-size="10"
        letter-spacing="1.5" fill="#9A5B1E">LA CADENA</text>
  <text x="414" y="118" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A18">Baja el río</text>
  <text x="414" y="134" font-family="Georgia, serif" font-size="13" fill="#9A5B1E">↓</text>
  <text x="414" y="152" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A18">Carga menos</text>
  <text x="414" y="168" font-family="Georgia, serif" font-size="13" fill="#9A5B1E">↓</text>
  <text x="414" y="186" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A18">Cuesta más</text>

  <text x="26" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6A6357">
    Según el Centro de Armadores Fluviales y Marítimos · la logística entró en modo emergencia
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
