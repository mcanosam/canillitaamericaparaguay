<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img"
     aria-labelledby="t-bioav d-bioav" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t-bioav">El puente está unido, lo que lo conecta no</title>
  <desc id="d-bioav">Tres obras del corredor comparadas: el puente con las márgenes unidas en junio de 2026, los accesos del lado paraguayo con 23% de avance y el lote 3 de la PY15 con 47,5% de ejecución física.</desc>

  <!--
    Ilustración propia. Se dibuja en vez de usar una foto de agencia: las
    imágenes de prensa requieren licencia, y el gráfico cuenta lo mismo con
    datos ya verificados en la nota.
    Paleta del diario: tinta #1A1A18, papel #F7F4EE, ocre #9A5B1E.
    Cada cifra de acá sale de los hechos confirmados del JSON de la historia.
  -->

  <rect width="520" height="250" fill="#EDE8DC"/>
  <text x="26" y="34" font-family="Arial Narrow, Arial, sans-serif" font-size="13"
        letter-spacing="2.6" fill="#9A5B1E">LA OBRA, POR PARTES</text>
  <line x1="26" y1="44" x2="494" y2="44" stroke="#1A1A18" stroke-width="1.5"/>
  <!-- El puente no lleva porcentaje: la fuente informa que las márgenes se
       unieron, no un avance medido. Se marca como hecho, no como barra. -->
  <text x="140" y="83" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
        font-size="11" fill="#1A1A18">El puente</text>
  <rect x="150" y="70" width="300" height="18" fill="#9A5B1E" opacity=".22"/>
  <text x="158" y="83" font-family="Arial, Helvetica, sans-serif" font-size="10.5"
        fill="#1A1A18">Márgenes unidas · junio 2026</text>
  <text x="140" y="125" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
        font-size="11" fill="#1A1A18">Los accesos</text>
  <rect x="150" y="112" width="300" height="18" fill="#1A1A18" opacity=".08"/>
  <rect x="150" y="112" width="69" height="18" fill="#9A5B1E"/>
  <text x="227" y="125" font-family="Georgia, serif" font-size="13"
        fill="#1A1A18">23%</text>
  <text x="140" y="167" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
        font-size="11" fill="#1A1A18">PY15, lote 3</text>
  <rect x="150" y="154" width="300" height="18" fill="#1A1A18" opacity=".08"/>
  <rect x="150" y="154" width="142" height="18" fill="#9A5B1E"/>
  <text x="300" y="167" font-family="Georgia, serif" font-size="13"
        fill="#1A1A18">47,5%</text>
  <line x1="150" y1="62" x2="150" y2="186" stroke="#1A1A18" stroke-width="1" opacity=".35"/>
  <text x="150" y="202" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6A6357">0%</text>
  <text x="450" y="202" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6A6357">100%</text>
  <text x="26" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6A6357">
    Accesos al 29 de septiembre de 2026 · lote 3 al 20 de octubre de 2026
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
