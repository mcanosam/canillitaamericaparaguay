<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img"
     aria-labelledby="t-ueno d-ueno" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t-ueno">Cuatro años de expansión y nueve días de caída</title>
  <desc id="d-ueno">Línea de tiempo de Ueno Bank: cinco hitos entre noviembre de 2023 y junio de 2026, y un bloque final destacado con los nueve días de noviembre de 2026 en los que el banco fue resuelto, renunció el Presidente y se pagó al 95% de los ahorristas.</desc>

  <!--
    Ilustración propia. Se dibuja en vez de usar una foto de agencia: las
    imágenes de prensa requieren licencia, y el gráfico cuenta lo mismo con
    datos ya verificados en la nota.
    Paleta del diario: tinta #1A1A18, papel #F7F4EE, ocre #9A5B1E.
    Cada cifra de acá sale de los hechos confirmados del JSON de la historia.
  -->

  <rect width="520" height="250" fill="#EDE8DC"/>
  <text x="26" y="34" font-family="Arial Narrow, Arial, sans-serif" font-size="13"
        letter-spacing="2.6" fill="#9A5B1E">CUATRO AÑOS, NUEVE DÍAS</text>
  <line x1="26" y1="44" x2="494" y2="44" stroke="#1A1A18" stroke-width="1.5"/>
  <line x1="48" y1="118" x2="390" y2="118" stroke="#1A1A18" stroke-width="2" opacity=".45"/>
  <circle cx="62" cy="118" r="6" fill="#EDE8DC" stroke="#1A1A18" stroke-width="2"/>
  <text x="62" y="98" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="10" letter-spacing="1" fill="#6A6357">NOV<tspan x='62' dy='13'>2023</tspan></text>
  <text x="62" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="9" fill="#1A1A18">Nace<tspan x="62" dy="11">el banco</tspan></text>
  <circle cx="150" cy="118" r="6" fill="#EDE8DC" stroke="#1A1A18" stroke-width="2"/>
  <text x="150" y="98" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="10" letter-spacing="1" fill="#6A6357">JUL<tspan x='150' dy='13'>2024</tspan></text>
  <text x="150" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="9" fill="#1A1A18">Absorbe<tspan x="150" dy="11">Visión</tspan></text>
  <circle cx="238" cy="118" r="6" fill="#EDE8DC" stroke="#1A1A18" stroke-width="2"/>
  <text x="238" y="98" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="10" letter-spacing="1" fill="#6A6357">SEP<tspan x='238' dy='13'>2025</tspan></text>
  <text x="238" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="9" fill="#1A1A18">Créditos<tspan x="238" dy="11">vinculados</tspan></text>
  <circle cx="300" cy="118" r="6" fill="#EDE8DC" stroke="#1A1A18" stroke-width="2"/>
  <text x="300" y="98" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="10" letter-spacing="1" fill="#6A6357">FEB<tspan x='300' dy='13'>2026</tspan></text>
  <text x="300" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="9" fill="#1A1A18">Sobregiros<tspan x="300" dy="11">por 60 M</tspan></text>
  <circle cx="352" cy="118" r="6" fill="#EDE8DC" stroke="#1A1A18" stroke-width="2"/>
  <text x="352" y="98" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="10" letter-spacing="1" fill="#6A6357">JUN<tspan x='352' dy='13'>2026</tspan></text>
  <text x="352" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="9" fill="#1A1A18">Seis<tspan x="352" dy="11">advertencias</tspan></text>

  <!-- Nueve días. Ocupan casi un cuarto del ancho a propósito: en la historia
       pesan tanto como los tres años anteriores. Van en lista vertical porque
       tres rótulos bajo tres puntos, en este ancho, se pisan entre sí. -->
  <rect x="398" y="58" width="96" height="140" fill="#9A5B1E" opacity=".10"/>
  <line x1="398" y1="58" x2="398" y2="198" stroke="#9A5B1E" stroke-width="1.5"/>
  <text x="446" y="76" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="10" letter-spacing="1.6" fill="#9A5B1E">NUEVE DÍAS</text>
  <line x1="412" y1="88" x2="480" y2="88" stroke="#9A5B1E" stroke-width="1" opacity=".5"/>

  <circle cx="412" cy="104" r="4.5" fill="#9A5B1E"/>
  <text x="424" y="108" font-family="Georgia, serif" font-size="12" fill="#1A1A18">3 nov</text>
  <text x="424" y="120" font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#6A6357">Resolución</text>

  <circle cx="412" cy="138" r="4.5" fill="#9A5B1E"/>
  <text x="424" y="142" font-family="Georgia, serif" font-size="12" fill="#1A1A18">5 nov</text>
  <text x="424" y="154" font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#6A6357">Renuncia</text>

  <circle cx="412" cy="172" r="4.5" fill="#9A5B1E"/>
  <text x="424" y="176" font-family="Georgia, serif" font-size="12" fill="#1A1A18">14 nov</text>
  <text x="424" y="188" font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#6A6357">95% pagado</text>

  <text x="26" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6A6357">
    Unos 850 millones de dólares del Estado y del IPS en custodia · casi 3 millones de clientes
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
