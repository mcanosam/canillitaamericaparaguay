<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img"
     aria-labelledby="t-bioesq d-bioesq" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t-bioesq">El corredor, de océano a océano</title>
  <desc id="d-bioesq">Esquema del Corredor Bioceánico en cinco puntos alineados, del Pacífico en Chile al Atlántico en Brasil, pasando por Misión La Paz en Argentina y por Pozo Hondo y Carmelo Peralta en Paraguay. El tramo paraguayo es la ruta PY15 a través del Chaco.</desc>

  <!--
    Ilustración propia. Se dibuja en vez de usar una foto de agencia: las
    imágenes de prensa requieren licencia, y el gráfico cuenta lo mismo con
    datos ya verificados en la nota.
    Paleta del diario: tinta #1A1A18, papel #F7F4EE, ocre #9A5B1E.
    Cada cifra de acá sale de los hechos confirmados del JSON de la historia.
  -->

  <rect width="520" height="250" fill="#EDE8DC"/>
  <text x="26" y="34" font-family="Arial Narrow, Arial, sans-serif" font-size="13"
        letter-spacing="2.6" fill="#9A5B1E">CUATRO PAÍSES, UNA RUTA</text>
  <line x1="26" y1="44" x2="494" y2="44" stroke="#1A1A18" stroke-width="1.5"/>
  <!-- Esquema, no mapa: es el orden de los puntos del corredor, sin pretensión
       geográfica. Dibujar un mapa exigiría trazados que no están en la nota. -->
  <line x1="58" y1="120" x2="462" y2="120" stroke="#1A1A18" stroke-width="2" opacity=".45"/>
  <rect x="260" y="112" width="100" height="16" fill="#9A5B1E" opacity=".18"/>
  <text x="310" y="104" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="10" letter-spacing="1.4" fill="#9A5B1E">PY15 · EL CHACO</text>
  <circle cx="58" cy="120" r="7" fill="#EDE8DC" stroke="#1A1A18" stroke-width="2"/>
  <text x="58" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10" fill="#1A1A18">Pacífico</text>
  <text x="58" y="163" text-anchor="middle" font-family="Georgia, serif"
        font-style="italic" font-size="9.5" fill="#6A6357">Chile</text>
  <circle cx="158" cy="120" r="7" fill="#EDE8DC" stroke="#1A1A18" stroke-width="2"/>
  <text x="158" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10" fill="#1A1A18">Misión<tspan x="158" dy="11">La Paz</tspan></text>
  <text x="158" y="174" text-anchor="middle" font-family="Georgia, serif"
        font-style="italic" font-size="9.5" fill="#6A6357">Argentina</text>
  <circle cx="260" cy="120" r="7" fill="#9A5B1E"/>
  <text x="260" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10" fill="#1A1A18">Pozo<tspan x="260" dy="11">Hondo</tspan></text>
  <text x="260" y="174" text-anchor="middle" font-family="Georgia, serif"
        font-style="italic" font-size="9.5" fill="#6A6357">Paraguay</text>
  <circle cx="360" cy="120" r="7" fill="#9A5B1E"/>
  <text x="360" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10" fill="#1A1A18">Carmelo<tspan x="360" dy="11">Peralta</tspan></text>
  <text x="360" y="174" text-anchor="middle" font-family="Georgia, serif"
        font-style="italic" font-size="9.5" fill="#6A6357">Paraguay</text>
  <circle cx="462" cy="120" r="7" fill="#EDE8DC" stroke="#1A1A18" stroke-width="2"/>
  <text x="462" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10" fill="#1A1A18">Atlántico</text>
  <text x="462" y="163" text-anchor="middle" font-family="Georgia, serif"
        font-style="italic" font-size="9.5" fill="#6A6357">Brasil</text>
  <!-- Los dos puentes van sobre el tramo que cruzan, no debajo de una punta:
       el puente está entre Carmelo Peralta y Porto Murtinho, no en Carmelo
       Peralta. Y no dice "construido": las márgenes están unidas, la
       habilitación sigue pendiente. -->
  <text x="209" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="8.5" fill="#6A6357">2º puente, proyectado</text>
  <text x="411" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="8.5" fill="#6A6357">el puente, sin habilitar</text>
  <text x="26" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6A6357">
    Más de 1.100 millones de dólares de inversión · el puente lo financia Itaipú Binacional
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
