<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img"
     aria-labelledby="t-asu d-asu" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t-asu">Las cuentas que recibió la nueva intendencia</title>
  <desc id="d-asu">Tres cifras de Asunción: 7,2 millones de dólares de deuda informados el 11 de noviembre de 2026, 4,5 millones ya pagados por los vecinos en obras de desagüe no ejecutadas, y 3.000 familias en riesgo de inundación.</desc>

  <!--
    Ilustración propia. Se dibuja en vez de usar una foto de agencia: las
    imágenes de prensa requieren licencia, y el gráfico cuenta lo mismo con
    datos ya verificados en la nota.
    Paleta del diario: tinta #1A1A18, papel #F7F4EE, ocre #9A5B1E.
    Cada cifra de acá sale de los hechos confirmados del JSON de la historia.
  -->

  <rect width="520" height="250" fill="#EDE8DC"/>
  <text x="26" y="34" font-family="Arial Narrow, Arial, sans-serif" font-size="13"
        letter-spacing="2.6" fill="#9A5B1E">LO QUE HEREDÓ LA CIUDAD</text>
  <line x1="26" y1="44" x2="494" y2="44" stroke="#1A1A18" stroke-width="1.5"/>
  <text x="110" y="118" text-anchor="middle" font-family="Georgia, serif"
        font-size="44" fill="#9A5B1E">7,2</text>
  <text x="110" y="140" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="11" letter-spacing="1.4" fill="#6A6357">MILLONES DE US$</text>
  <text x="110" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10.5" fill="#1A1A18">de deuda recibida<tspan x="110" dy="13">el 11 de noviembre</tspan></text>
  <line x1="203" y1="76" x2="203" y2="180" stroke="#1A1A18" stroke-width="1" opacity=".22"/>
  <text x="296" y="118" text-anchor="middle" font-family="Georgia, serif"
        font-size="36" fill="#1A1A18">4,5</text>
  <text x="296" y="140" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="11" letter-spacing="1.4" fill="#6A6357">MILLONES DE US$</text>
  <text x="296" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10.5" fill="#1A1A18">ya pagados por vecinos<tspan x="296" dy="13">por desagües no ejecutados</tspan></text>
  <line x1="389" y1="76" x2="389" y2="180" stroke="#1A1A18" stroke-width="1" opacity=".22"/>
  <text x="448" y="118" text-anchor="middle" font-family="Georgia, serif"
        font-size="36" fill="#1A1A18">3.000</text>
  <text x="448" y="140" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif"
        font-size="11" letter-spacing="1.4" fill="#6A6357">FAMILIAS</text>
  <text x="448" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10.5" fill="#1A1A18">en riesgo<tspan x="448" dy="13">de inundación</tspan></text>
  <text x="26" y="238" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6A6357">
    Soledad Núñez asumió el 3 de noviembre de 2026 · sin combustible para la recolección
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
